<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDENG Links OG Image Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        anton: ['Anton', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: '#6849E1',
                        brandLight: '#7C7AEA',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
        }
        
        .og-container {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            background-color: #f8f9fa;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mesh Gradient Blobs */
        .blob {
            position: absolute;
            filter: blur(100px);
            opacity: 0.65;
            border-radius: 50%;
            z-index: 1;
        }
        
        .blob-1 {
            width: 700px;
            height: 700px;
            background: #6849E1;
            top: -200px;
            left: -150px;
        }

        .blob-2 {
            width: 650px;
            height: 650px;
            background: #FF7EB3;
            bottom: -200px;
            right: -100px;
            opacity: 0.45;
        }

        .blob-3 {
            width: 500px;
            height: 500px;
            background: #7C7AEA;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.35;
        }

        /* Noise & Texture */
        .noise {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0.45;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
        }

        .grid-pattern {
            position: absolute;
            inset: 0;
            z-index: 1;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(104, 73, 225, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(104, 73, 225, 0.05) 1px, transparent 1px);
        }

        /* Content Container */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(104, 73, 225, 0.25));
            margin-bottom: 1rem;
        }

        .badge {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 32px;
            border-radius: 100px;
            color: #6849E1;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(104, 73, 225, 0.15);
            margin-bottom: -10px;
            z-index: 20;
        }
    </style>
</head>
<body>

    <div class="og-container">
        <!-- Background Decor -->
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="grid-pattern"></div>
        <div class="noise"></div>

        <!-- MUDENG Content -->
        <div class="content-wrapper">
            <img src="https://cdn.mudeng.oktaa.my.id/logo/logo-monogram.svg" alt="MUDENG Logo" class="logo mt-6">
            <h1 class="font-anton font-normal text-[100px] leading-none tracking-[12px] text-[#6667E4]/90 uppercase mt-4 drop-shadow-md">
                LINKS
            </h1>
        </div>
    </div>

</body>
</html>
